name: Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'arena/**'

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9 --distribution-type bin 2>&1 | tee ci/build.log || true

      - name: Unit tests + assemble debug + release
        id: assemble
        run: |
          mkdir -p ci dist
          set -o pipefail
          gradle testDebugUnitTest assembleDebug assembleRelease --stacktrace --warning-mode=summary 2>&1 | tee -a ci/build.log

      - name: Collect APKs
        if: always()
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/SEGAWA-OS-debug.apk 2>/dev/null || true
          cp app/build/outputs/apk/release/*.apk dist/SEGAWA-OS-release.apk 2>/dev/null || true
          ls -la dist || true
          echo "### Build result: ${{ steps.assemble.outcome }}" >> $GITHUB_STEP_SUMMARY
          grep -E "^e: |error:" ci/build.log | head -40 >> $GITHUB_STEP_SUMMARY || true

      - name: Publish GitHub release with APKs
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v2.0.0 >/dev/null 2>&1 || gh release create v2.0.0 \
            --title "SEGAWA OS v2.0.0 (Sakura) — Android launcher" \
            --notes "Installable SEGAWA OS v2.0 build. Debug APK is signed with the debug key and installs on any API 26+ device; release APK is signed with the same key so updates install over each other. v1.0.0/v1.1.0 releases are left untouched." \
            --prerelease
          gh release upload v2.0.0 dist/SEGAWA-OS-debug.apk dist/SEGAWA-OS-release.apk --clobber

      - name: Publish outputs back to branch
        if: always()
        run: |
          set -x
          git config user.name "SEGAWA CI"
          git config user.email "ci@mio.os"
          git add -f ci/build.log 2>/dev/null || true
          git add -f dist 2>/dev/null || true
          git diff --cached --quiet || git commit -m "ci: build log + APKs [skip ci]"
          for i in 1 2 3 4 5 6; do
            git fetch origin ${GITHUB_REF_NAME} && git rebase FETCH_HEAD || git rebase --abort
            git push origin HEAD:${GITHUB_REF_NAME} && break
            sleep 10
          done
