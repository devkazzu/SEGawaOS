name: Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'arena/**'

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9 --distribution-type bin 2>&1 | tee -a ci/build.log || true

      - name: Assemble debug + release
        id: assemble
        run: |
          mkdir -p ci dist
          set -o pipefail
          gradle assembleDebug assembleRelease --stacktrace --warning-mode=summary 2>&1 | tee -a ci/build.log

      - name: Collect APKs
        if: always()
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/MIO-OS-debug.apk 2>/dev/null || true
          cp app/build/outputs/apk/release/*.apk dist/MIO-OS-release.apk 2>/dev/null || true
          ls -la dist || true
          echo "### Build result: ${{ steps.assemble.outcome }}" >> $GITHUB_STEP_SUMMARY
          grep -E "^e: |error:" ci/build.log | head -40 >> $GITHUB_STEP_SUMMARY || true

      - name: Publish outputs back to branch
        if: always()
        run: |
          git config user.name "MIO CI"
          git config user.email "ci@mio.os"
          git add -f ci/build.log 2>/dev/null || true
          git add -f dist 2>/dev/null || true
          git diff --cached --quiet || git commit -m "ci: build log + APKs [skip ci]"
          git push origin HEAD:${{ github.ref_name }} || echo "push failed"
