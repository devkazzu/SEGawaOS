name: Launcher Emulator Test

on:
  workflow_dispatch:
  push:
    branches:
      - 'arena/**'

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run launcher tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          disable-animations: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -x
            APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
            adb install -r -g "$APK"
            PKG=com.mio.os.debug
            adb shell pm list packages | grep mio

            echo "=== 1. HOME intent filter present? ==="
            adb shell cmd package query-activities --brief -a android.intent.action.MAIN -c android.intent.category.HOME | grep -i mio

            echo "=== 2. Ask Android to make MIO OS the default home app ==="
            adb shell cmd package set-home-activity $PKG/com.mio.os.MainActivity
            sleep 2

            echo "=== 3. Launch MIO OS ==="
            adb shell am start -n $PKG/com.mio.os.MainActivity
            sleep 4
            adb exec-out screencap -p > shots_01_home.png

            echo "=== 4. Press the HOME key (must go to MIO OS) ==="
            adb shell input keyevent KEYCODE_HOME
            sleep 3
            adb shell dumpsys window | grep -E "mCurrentFocus|mFocusedApp" || true
            adb exec-out screencap -p > shots_02_after_home.png

            echo "=== 5. Swipe up for the app drawer ==="
            adb shell input swipe 540 1800 540 500 300
            sleep 2
            adb exec-out screencap -p > shots_03_drawer.png

            echo "=== 6. Back home, swipe down for control centre ==="
            adb shell input keyevent KEYCODE_BACK
            sleep 1
            adb shell input swipe 540 400 540 1600 300
            sleep 2
            adb exec-out screencap -p > shots_04_control_center.png

            echo "=== 7. Open settings via the gear, then screenshot ==="
            adb shell input keyevent KEYCODE_BACK
            sleep 1
            adb shell am start -n $PKG/com.mio.os.MainActivity
            sleep 2
            adb exec-out screencap -p > shots_05_home.png

            echo "=== 8. Launch a third-party app from the drawer (Settings app) ==="
            adb shell am start -a android.settings.SETTINGS >/dev/null
            sleep 3
            adb shell input keyevent KEYCODE_HOME
            sleep 2
            adb shell dumpsys window | grep -E "mCurrentFocus" || true

            echo "=== 9. Stability: random UI monkey 400 events ==="
            adb shell monkey -p $PKG --throttle 120 --pct-syskeys 0 -v 400 >/dev/null 2>&1 || true
            sleep 2
            adb shell input keyevent KEYCODE_HOME
            sleep 2
            adb exec-out screencap -p > shots_06_after_monkey.png

            echo "=== 10. Crash check in logcat ==="
            adb logcat -d -b crash > crashlog.txt || true
            if grep -q "com.mio.os" crashlog.txt; then echo "CRASH DETECTED"; cat crashlog.txt; fi
            adb logcat -d | grep -iE "FATAL EXCEPTION|AndroidRuntime.*com.mio.os" | tail -50 || echo "no fatal exceptions"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mio-os-emulator-screenshots
          path: |
            shots_*.png
            crashlog.txt
          if-no-files-found: warn
