name: Launcher Emulator Test

on:
  workflow_dispatch:
  push:
    branches:
      - 'arena/**'

permissions:
  contents: write

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.actor != 'github-actions[bot]'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace 2>&1 | tail -20

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run launcher tests on emulator
        id: emu
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/emulator-test.sh 2>&1 | tee ci/emulator-report.txt

      - name: Record outcome
        if: always()
        run: |
          mkdir -p ci/shots
          {
            echo ""
            echo "=== workflow outcome ==="
            echo "emulator step: ${{ steps.emu.outcome }}"
            echo "screenshots:"
            ls -la ci/shots || true
            echo "report bytes: $(wc -c < ci/emulator-report.txt 2>/dev/null || echo 0)"
          } >> ci/emulator-report.txt
          touch ci/shots/.keep

      - name: Publish report + screenshots to branch
        if: always()
        run: |
          git config user.name "MIO CI"
          git config user.email "ci@mio.os"
          set -x
          git add -f ci/emulator-report.txt 2>/dev/null || true
          git add -f ci/shots 2>/dev/null || true
          git diff --cached --quiet || git commit -m "ci: emulator report + screenshots [skip ci]"
          for i in 1 2 3 4 5 6; do
            git fetch origin ${GITHUB_REF_NAME} && git rebase FETCH_HEAD || git rebase --abort
            git push origin HEAD:${GITHUB_REF_NAME} && break
            sleep 10
          done
